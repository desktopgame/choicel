name: Emacs tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - run: emacs -Q --batch -L . -l test/choicel-test.el -f ert-run-tests-batch-and-exit
      - run: emacs -Q --batch -L . --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile choicel.el
